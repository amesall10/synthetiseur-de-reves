name: CI

on:
  push:
    branches: [main]
  # Toutes les PR, y compris les PR empilées qui visent une branche feat/*.
  pull_request:
  # Lancement manuel depuis l'onglet Actions (si les webhooks sont en panne).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint : règles ruff + formatage
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Ruff -- règles de lint
        run: ruff check .

      - name: Ruff -- formatage
        run: ruff format --check .

  # ---------------------------------------------------------------------------
  # 2. Tests sur PostgreSQL (même moteur qu'en production) + seuil de couverture
  # ---------------------------------------------------------------------------
  test:
    name: Tests (pytest + couverture >= 70 %)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reves
          POSTGRES_USER: reves
          POSTGRES_PASSWORD: reves
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reves -d reves"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://reves:reves@localhost:5432/reves
      DJANGO_SECRET_KEY: ci-only-secret-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test

      - name: Pytest
        run: >-
          pytest
          --cov=dreams --cov=accounts
          --cov-report=term-missing --cov-report=xml
          --cov-fail-under=70

      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 3. Build Docker + test de fumée (le conteneur démarre et répond)
  # ---------------------------------------------------------------------------
  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image
        run: docker build -t synthetiseur-de-reves .

      - name: Test de fumée
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e DJANGO_SECRET_KEY=smoke-test-only \
            -e DATABASE_URL=sqlite:////tmp/smoke.sqlite3 \
            synthetiseur-de-reves
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "Le conteneur répond."; exit 0
            fi
            sleep 2
          done
          docker logs smoke
          exit 1

  # ---------------------------------------------------------------------------
  # 4. Déploiement Render : sur main uniquement, après lint, tests et build
  # ---------------------------------------------------------------------------
  deploy:
    name: Déploiement Render
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Appel du deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::Secret RENDER_DEPLOY_HOOK absent : déploiement ignoré."
            exit 0
          fi
          # L'URL contient une clé : elle n'est jamais affichée (secret masqué).
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
          echo "Déploiement demandé à Render."
