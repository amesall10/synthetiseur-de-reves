{# Rendu générique d'un formulaire Django : erreurs globales puis champs. #}
{% if form.non_field_errors %}
  <div class="mb-4 rounded-md border border-red-800 bg-red-950 px-4 py-2 text-sm text-red-200">
    {{ form.non_field_errors }}
  </div>
{% endif %}
{% for field in form %}
  <div class="mb-4">
    <label for="{{ field.id_for_label }}" class="text-sm font-medium">{{ field.label }}</label>
    {{ field }}
    {{ field.errors }}
    {% if field.help_text %}<div class="helptext mt-1">{{ field.help_text|safe }}</div>{% endif %}
  </div>
{% endfor %}
