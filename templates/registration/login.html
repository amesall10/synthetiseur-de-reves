{% extends "base.html" %}

{% block title %}Connexion · Synthétiseur de rêves{% endblock %}

{% block content %}
<div class="mx-auto max-w-sm">
  <h1 class="mb-6 text-2xl font-semibold">Connexion</h1>
  <form method="post">
    {% csrf_token %}
    {% include "_form.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="w-full rounded-md bg-indigo-600 px-4 py-2 font-medium hover:bg-indigo-500">Se connecter</button>
  </form>
  <p class="mt-4 text-sm text-slate-400">
    Pas encore de compte ? <a href="{% url 'accounts:signup' %}" class="text-indigo-300 underline">Créer un compte</a>
  </p>
</div>
{% endblock %}
