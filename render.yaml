# Blueprint Render : service web Docker + PostgreSQL, région Francfort (UE).
# Les données (récits, images) restent dans l'UE, comme les sous-traitants
# IA (D23, D35). Les clés d'API se saisissent dans le tableau de bord Render
# (sync: false) : elles ne sont jamais écrites dans le dépôt.
services:
  - type: web
    name: synthetiseur-de-reves
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Déploiement déclenché par la CI (deploy hook), seulement après des
    # tests verts sur main : pas de déploiement automatique à chaque push.
    autoDeploy: false
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: synthetiseur-de-reves-db
          property: connectionString
      # IP réelle du client derrière le proxy Render (preuve de consentement).
      - key: USE_X_FORWARDED_FOR
        value: "True"
      - key: ADMIN_URL
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: SCALEWAY_API_KEY
        sync: false
      - key: BFL_API_KEY
        sync: false
      # Sans BFL_API_KEY, /health le signale (D27) et l'image est simulée.
      - key: IMAGE_PROVIDER
        value: bfl
      - key: MONTHLY_BUDGET_USD
        value: "20"
      - key: DREAM_RETENTION_DAYS
        value: "365"
      - key: SENTRY_DSN
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_THREADS
        value: "4"

databases:
  - name: synthetiseur-de-reves-db
    region: frankfurt
    plan: free
    databaseName: reves
    user: reves
    postgresMajorVersion: "16"
